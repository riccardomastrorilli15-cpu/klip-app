[package]
name = "klip"
version = "0.3.0"
edition = "2021"
description = "Clipboard history (text and images) plus a file and app finder, in one keyboard-first window. In memory only, no network."
license = "MIT"
rust-version = "1.89"

[dependencies]
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
png = "0.17"
clipboard-master = "4"
global-hotkey = "0.7"
tao = "0.30"
tray-icon = "0.19"
eframe = { version = "0.32", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
